name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'justfile'
            frontend:
              - 'frontend/**'
              - 'justfile'

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Verify Bun runtime
        run: bun --version

      - name: Check conventional commits
        if: github.event_name == 'pull_request'
        run: cd backend && uv sync --dev && uv run cz check --rev-range origin/main..HEAD

      - name: Check Python lockfile
        run: cd backend && uv lock --check

      - name: Check JS lockfile
        run: cd frontend && bun install --frozen-lockfile

      - name: Validate documentation accuracy
        run: bash scripts/validate-docs.sh

      - name: Validate deploy configs
        run: |
          python3 -c "
          import yaml, configparser, sys
          errors = []
          for f in ['.do/deploy.template.yaml', 'render.yaml']:
              try:
                  data = yaml.safe_load(open(f))
                  if f == '.do/deploy.template.yaml' and 'spec' not in data:
                      errors.append(f'{f}: missing spec key')
              except Exception as e:
                  errors.append(f'{f}: {e}')
          try:
              c = configparser.ConfigParser()
              c.read('railway.toml')
              if 'build' not in c.sections():
                  errors.append('railway.toml: missing [build]')
              if 'deploy' not in c.sections():
                  errors.append('railway.toml: missing [deploy]')
          except Exception as e:
              errors.append(f'railway.toml: {e}')
          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              sys.exit(1)
          print('All deploy configs valid')
          "

      - name: Check Makefile is in sync with justfile
        if: steps.filter.outputs.backend == 'true' || github.ref == 'refs/heads/main'
        run: python scripts/just-to-make.py --check

      - name: Prepare failure summary
        if: failure()
        run: |
          echo "::error::Prepare checks failed. See step details above."
          echo "## ❌ Prepare Checks Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "One or more preparation checks failed. Check the failed step above for details." >> "$GITHUB_STEP_SUMMARY"
          echo "- ❌ Conventional commits check failed" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare success summary
        if: success()
        run: |
          echo "## ✅ Prepare Checks" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Path changes detected" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Python lockfile (uv)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ JS lockfile (bun)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Documentation validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Deploy config validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Conventional commits validated" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.filter.outputs.backend }}" == "true" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "- ✅ Justfile/Makefile sync" >> "$GITHUB_STEP_SUMMARY"
          fi

  backend-quality:
    needs: [prepare]
    if: needs.prepare.outputs.backend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci  # pragma: allowlist secret
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: cd backend && uv sync --dev

      - name: Lint
        id: lint
        run: cd backend && uv run ruff check . && uv run ruff format --check .

      - name: Typecheck
        id: typecheck
        run: bash scripts/check-typecheck-baseline.sh

      - name: Test
        id: test
        run: cd backend && uv run pytest tests/unit tests/matching tests/test_config.py tests/architecture tests/integration --cov=app --cov-report=xml
        env:
          TEST_DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"  # pragma: allowlist secret

      - name: Security scan (bandit)
        id: security-scan
        run: cd backend && uv run bandit -r app/

      # Advisory freshness (uv audit) is a hard gate on PRs only. On main it
      # moves to the weekly dependency-advisory-triage job (ADR-0012): three
      # same-day advisories on 2026-11-13 reddened main between PRs, so main
      # pushes no longer gate on advisory database drift they cannot control.
      - name: Dependency audit (uv audit)
        id: dependency-audit
        if: github.event_name == 'pull_request'
        run: cd backend && uv audit

      - name: Security tests
        id: security-tests
        run: cd backend && uv run pytest tests/security/ -v --tb=short

      - name: Dead code analysis (vulture)
        id: dead-code
        run: cd backend && uv run vulture app/ vulture_whitelist.py --min-confidence 80

      - name: Update coverage badge
        if: always() && steps.test.outcome == 'success' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          COVERAGE=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('backend/coverage.xml')
          rate = tree.getroot().attrib['line-rate']
          print(f'{float(rate) * 100:.0f}')
          ")
          COLOR=$(python3 -c "print({'9':'brightgreen','8':'green','7':'yellowgreen','6':'yellow','5':'orange'}.get('${COVERAGE:0:1}','red'))")
          cat > /tmp/coverage.json <<EOF
          {"schemaVersion":1,"label":"coverage","message":"${COVERAGE}%","color":"${COLOR}"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan badges
          git rm -rf . 2>/dev/null || true
          cp /tmp/coverage.json coverage.json
          git add coverage.json
          git commit -m "update coverage badge: ${COVERAGE}%" --allow-empty
          PUSH_OK=0
          for ATTEMPT in 1 2 3; do
            if git push origin badges --force; then
              PUSH_OK=1
              break
            fi
            echo "::warning::Badge push attempt ${ATTEMPT} of 3 failed; retrying"
            sleep 15
          done
          if [ "$PUSH_OK" -ne 1 ]; then
            echo "::warning::Badge push failed after 3 attempts; coverage badge not updated (cosmetic, non-blocking)"
            exit 0
          fi

      - name: Backend failure summary
        if: failure()
        run: |
          FAILED_STEPS=""
          PASSED_STEPS=""

          if [[ "${{ steps.lint.outcome }}" == "success" ]]; then PASSED_STEPS="$PASSED_STEPS\n- ✅ Lint (ruff)"; else FAILED_STEPS="$FAILED_STEPS\n- ❌ Lint (ruff)"; fi
          if [[ "${{ steps.typecheck.outcome }}" == "success" ]]; then PASSED_STEPS="$PASSED_STEPS\n- ✅ Typecheck (basedpyright)"; else FAILED_STEPS="$FAILED_STEPS\n- ❌ Typecheck (basedpyright)"; fi
          if [[ "${{ steps.test.outcome }}" == "success" ]]; then PASSED_STEPS="$PASSED_STEPS\n- ✅ Tests (pytest)"; else FAILED_STEPS="$FAILED_STEPS\n- ❌ Tests (pytest)"; fi
          if [[ "${{ steps.security-scan.outcome }}" == "success" ]]; then PASSED_STEPS="$PASSED_STEPS\n- ✅ Security scan (bandit)"; else FAILED_STEPS="$FAILED_STEPS\n- ❌ Security scan (bandit)"; fi
          if [[ "${{ steps.dependency-audit.outcome }}" == "success" ]]; then PASSED_STEPS="$PASSED_STEPS\n- ✅ Dependency audit (uv audit)"; elif [[ "${{ steps.dependency-audit.outcome }}" == "skipped" ]]; then PASSED_STEPS="$PASSED_STEPS\n- ➖ Dependency audit (uv audit) skipped (not reached, or PR-only gate per ADR-0012)"; else FAILED_STEPS="$FAILED_STEPS\n- ❌ Dependency audit (uv audit)"; fi
          if [[ "${{ steps.security-tests.outcome }}" == "success" ]]; then PASSED_STEPS="$PASSED_STEPS\n- ✅ Security tests"; else FAILED_STEPS="$FAILED_STEPS\n- ❌ Security tests"; fi
          if [[ "${{ steps.dead-code.outcome }}" == "success" ]]; then PASSED_STEPS="$PASSED_STEPS\n- ✅ Dead code analysis (vulture)"; else FAILED_STEPS="$FAILED_STEPS\n- ❌ Dead code analysis (vulture)"; fi

          FIRST_FAIL=$(echo -e "$FAILED_STEPS" | grep -m1 "❌" || true)
          echo "::error::Backend quality gate failed:$FIRST_FAIL"

          echo "## ❌ Backend Quality Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Failed" >> "$GITHUB_STEP_SUMMARY"
          echo -e "$FAILED_STEPS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Passed" >> "$GITHUB_STEP_SUMMARY"
          echo -e "$PASSED_STEPS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Steps after the first failure were not executed._" >> "$GITHUB_STEP_SUMMARY"

      - name: Backend success summary
        if: success()
        run: |
          echo "## ✅ Backend Quality Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Lint (ruff)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Typecheck (basedpyright)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Tests (pytest)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Security scan (bandit)" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "- ✅ Dependency audit (uv audit)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ⏭️ Dependency audit (uv audit) skipped — PR-only gate; scheduled triage job owns main (ADR-0012)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- ✅ Security tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Dead code analysis (vulture)" >> "$GITHUB_STEP_SUMMARY"

  frontend-quality:
    needs: [prepare]
    if: needs.prepare.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Verify Bun runtime
        run: bun --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: cd frontend && bun install --frozen-lockfile

      - name: Lint
        id: lint
        run: cd frontend && bun run lint && bun run fmt:check

      - name: Typecheck
        id: typecheck
        run: cd frontend && bun run check

      - name: Build
        id: build
        run: cd frontend && bun run build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"  # pragma: allowlist secret
          BETTER_AUTH_SECRET: "ci-placeholder"  # pragma: allowlist secret
          DEMO_MODE: "false"
          OCR_PROVIDER_API_KEY: "ci-placeholder"  # pragma: allowlist secret
          OCR_PROVIDER_NAME: "openai"
          OCR_PROVIDER_MODEL: "gpt-4o-mini"

      - name: Test
        id: test
        run: cd frontend && bun run prepare && bun run test:unit

      # Advisory freshness (bun audit) is a hard gate on PRs only. On main it
      # moves to the weekly dependency-advisory-triage job (ADR-0012) so a
      # same-day advisory cannot redden main between PRs.
      - name: Security scan (bun audit)
        id: security-scan
        if: github.event_name == 'pull_request'
        # Ignored advisories — no in-range fix; dev/build-time only except as noted below:
        #   GHSA-vfj7-8cjw-p6xm (braces HIGH): flag removed 2026-11-07 — advisory withdrawn
        #     upstream; bun audit no longer reports it. Re-add only if reporting resumes.
        #   GHSA-gcqx-w48m-w2h4 (deepmerge LOW): no fixed release upstream (4.3.1 is latest);
        #     build-time chains: @sveltejs/vite-plugin-svelte;
        #     @sveltejs/adapter-node > @rollup/plugin-node-resolve.
        #   GHSA-3g3m-2fjr-6pw4 (glob MODERATE): fix exists (14.0.2+), but bun.lock resolves four
        #     glob majors (13.0.6, 2.1.1, 3.3.3, 4.0.3), so forcing 14 globally is high blast
        #     radius; the flagged instance is the dev codegen CLI chain
        #     (@openapitools/openapi-generator-cli); blocked upstream; nothing ships to production.
        #   GHSA-g3hv-75wg-m249 (minimatch MODERATE): fixed only in minimatch 11.0.1+, but archunit
        #     (frontend architecture-test runner, upstream declares minimatch ^10.0.1, latest 2.5.4)
        #     breaks on minimatch 11 (minimatch.makeRe removed), so 11 cannot be forced globally;
        #     reached only via dev/build-time chains (archunit, eslint, typescript-eslint,
        #     openapi-generator-cli); nothing ships to production. Drop the <11 override ceiling in
        #     frontend/package.json when archunit ships minimatch-11 support.
        #   GHSA-h4fr-cmh5-qr62, GHSA-jfwm-3p3c-6hx5 (fallow LOW x2): fix is fallow 3.34.0 (major);
        #     dev-only architecture-test runner.
        # Runtime dependencies are remediated (SvelteKit 3 LOWs resolved by the Kit 3 upgrade);
        # all flagged chains are dev/build-time only and do not ship to production.
        run: >-
          cd frontend && bun audit
          --ignore GHSA-gcqx-w48m-w2h4
          --ignore GHSA-3g3m-2fjr-6pw4
          --ignore GHSA-g3hv-75wg-m249
          --ignore GHSA-h4fr-cmh5-qr62
          --ignore GHSA-jfwm-3p3c-6hx5

      - name: Frontend failure summary
        if: failure()
        run: |
          FAILED_STEPS=""
          PASSED_STEPS=""

          if [[ "${{ steps.lint.outcome }}" == "success" ]]; then PASSED_STEPS="$PASSED_STEPS\n- ✅ Lint (oxlint + prettier)"; else FAILED_STEPS="$FAILED_STEPS\n- ❌ Lint (oxlint + prettier)"; fi
          if [[ "${{ steps.typecheck.outcome }}" == "success" ]]; then PASSED_STEPS="$PASSED_STEPS\n- ✅ Typecheck (svelte-check)"; else FAILED_STEPS="$FAILED_STEPS\n- ❌ Typecheck (svelte-check)"; fi
          if [[ "${{ steps.build.outcome }}" == "success" ]]; then PASSED_STEPS="$PASSED_STEPS\n- ✅ Build (vite)"; else FAILED_STEPS="$FAILED_STEPS\n- ❌ Build (vite)"; fi
          if [[ "${{ steps.test.outcome }}" == "success" ]]; then PASSED_STEPS="$PASSED_STEPS\n- ✅ Tests (vitest)"; else FAILED_STEPS="$FAILED_STEPS\n- ❌ Tests (vitest)"; fi
          if [[ "${{ steps.security-scan.outcome }}" == "success" ]]; then PASSED_STEPS="$PASSED_STEPS\n- ✅ Security scan (bun audit)"; elif [[ "${{ steps.security-scan.outcome }}" == "skipped" ]]; then PASSED_STEPS="$PASSED_STEPS\n- ➖ Security scan (bun audit) skipped (not reached, or PR-only gate per ADR-0012)"; else FAILED_STEPS="$FAILED_STEPS\n- ❌ Security scan (bun audit)"; fi

          FIRST_FAIL=$(echo -e "$FAILED_STEPS" | grep -m1 "❌" || true)
          echo "::error::Frontend quality gate failed:$FIRST_FAIL"

          echo "## ❌ Frontend Quality Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Failed" >> "$GITHUB_STEP_SUMMARY"
          echo -e "$FAILED_STEPS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Passed" >> "$GITHUB_STEP_SUMMARY"
          echo -e "$PASSED_STEPS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Steps after the first failure were not executed._" >> "$GITHUB_STEP_SUMMARY"

      - name: Frontend success summary
        if: success()
        run: |
          echo "## ✅ Frontend Quality Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Lint (oxlint + prettier)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Typecheck (svelte-check)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Build (vite)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Tests (vitest)" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "- ✅ Security scan (bun audit)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ⏭️ Security scan (bun audit) skipped — PR-only gate; scheduled triage job owns main (ADR-0012)" >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend-fallow:
    needs: [prepare]
    if: needs.prepare.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Verify Bun runtime
        run: bun --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: cd frontend && bun install --frozen-lockfile

      - name: Run fallow audit
        id: fallow-audit
        run: cd frontend && npx fallow audit --base origin/main --format compact

      - name: Fallow audit summary
        if: failure()
        run: |
          if [[ "${{ steps.fallow-audit.outcome }}" == "failure" ]]; then
            echo "::error::Fallow audit found dead or unused code in the frontend. Run 'cd frontend && npx fallow audit --base origin/main' locally to see details."
            echo "## ❌ Fallow Audit Failed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Fallow audit job failed before the audit could run — dependency install or infrastructure issue, not dead-code findings. Re-run the job and check the logs."
            echo "## ❌ Fallow Audit Failed Before Scanning" >> "$GITHUB_STEP_SUMMARY"
          fi

  dependency-advisory-triage:
    # Advisory triage for main (ADR-0012). Hard uv/bun audit gates run on PRs
    # only, so advisory-database drift cannot redden main between PRs. This
    # job re-audits main after every merge (push), on the nominal weekly
    # schedule, and on demand (workflow_dispatch), filing (or updating) a
    # labeled issue for human triage. Advisory findings never fail the job —
    # the audit steps exit 0 on findings and only the issue records them.
    # Tooling failures (dependency install, audit crashes) fail the run by
    # design so they stay visible.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    concurrency:
      # GitHub retains only ONE pending run per concurrency group, so bursty
      # merges can supersede (drop) an intermediate queued run's verdict.
      # Execution is serialized and the newest state is always the one
      # audited, but an intermediate queued verdict may never be produced.
      group: dependency-advisory-triage
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Install dependencies
        run: |
          cd backend && uv sync --dev
          cd "${GITHUB_WORKSPACE}" && cd frontend && bun install --frozen-lockfile

      - name: Backend advisories (uv audit)
        id: uv-audit
        # Exit-code contract: 0 = clean, 1 = advisories found (the expected
        # triage signal, exit 0 here — only the issue records it), anything
        # else = tooling error, which fails this step on purpose (ADR-0012).
        run: |
          cd backend
          set +e
          uv audit > ../uv-audit.txt 2>&1
          code=$?
          set -e
          cat ../uv-audit.txt
          if [ "$code" -eq 0 ]; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 1 ]; then
            echo "status=findings" >> "$GITHUB_OUTPUT"
          else
            echo "status=error" >> "$GITHUB_OUTPUT"
            echo "::error::uv audit failed with exit code ${code} — tooling error, not advisory findings"
            {
              echo "### ❌ uv audit tooling error"
              echo ""
              echo "Exit code ${code}. Fails the run by design (ADR-0012); no advisory issue is filed from a failed audit."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Frontend advisories (bun audit)
        id: bun-audit
        # Ignore list mirrors the PR gate in frontend-quality and
        # `just security-scan-frontend` — keep all three in sync.
        # Exit-code contract: bun exits 1 for BOTH advisories-found and
        # registry/malformed-response errors, so exit 1 alone cannot classify
        # the run (a registry error would file a bogus advisory issue). Worse,
        # bun's `--json` mode does not apply `--ignore` — it lists every
        # advisory, ignored or not. Classification is therefore corroborated:
        # the text audit (which honors --ignore) is the gate; its exit 1 is
        # findings only if the JSON report parses AND lists an advisory id
        # outside the ignore list. Anything else on exit 1, or any other
        # exit code, is a tooling error that fails the run (ADR-0012).
        env:
          IGNORES: "GHSA-gcqx-w48m-w2h4 GHSA-3g3m-2fjr-6pw4 GHSA-g3hv-75wg-m249 GHSA-h4fr-cmh5-qr62 GHSA-jfwm-3p3c-6hx5"
        run: |
          cd frontend
          IGNORE_FLAGS=""
          for id in $IGNORES; do IGNORE_FLAGS="$IGNORE_FLAGS --ignore $id"; done
          set +e
          # shellcheck disable=SC2086
          bun audit $IGNORE_FLAGS > ../bun-audit.txt 2>&1
          code=$?
          if [ "$code" -eq 1 ]; then
            # Corroboration pass (see exit-code contract above).
            bun audit --json > ../bun-audit.json 2>/dev/null
          fi
          set -e
          cat ../bun-audit.txt
          status=error
          if [ "$code" -eq 0 ]; then
            status=clean
          elif [ "$code" -eq 1 ]; then
            # Corroborator: parse the JSON report, drop advisory ids on the
            # ignore list (filter(Boolean) so a record without a usable url
            # cannot inject an empty-string id), exit 0 only if a non-ignored
            # id remains. Unparseable JSON (registry error) raises, exits
            # nonzero -> tooling error.
            if python3 -c 'import json,sys; ignored=set(sys.argv[1].split()); report=json.load(open("../bun-audit.json")); ids=set(filter(None,[str(a.get("url","")).rsplit("/",1)[-1] for v in report.values() for a in v])); sys.exit(0 if ids-ignored else 1)' "$IGNORES"; then
              status=findings
            fi
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "error" ]; then
            echo "::error::bun audit failed (exit ${code}) — not confirmed as non-ignored advisory findings; treating as tooling error (ADR-0012)"
            {
              echo "### ❌ bun audit tooling error"
              echo ""
              echo "Exit code ${code}, unconfirmed as non-ignored advisory findings. Fails the run by design (ADR-0012); no advisory issue is filed from a failed audit."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: File or update advisory triage issue
        if: always()
        uses: actions/github-script@v7
        env:
          UV_STATUS: ${{ steps.uv-audit.outputs.status }}
          BUN_STATUS: ${{ steps.bun-audit.outputs.status }}
        with:
          script: |
            const fs = require('fs');
            // Audit output is third-party text (advisory metadata, package
            // names): neutralize backtick runs so it cannot break out of the
            // fenced block, and @ mentions so the bot issue cannot ping anyone.
            const sanitize = (text) => text.replace(/`+/g, "'").replace(/@/g, "@\u200b");
            const readAudit = (file) => {
              try {
                return sanitize(fs.readFileSync(file, 'utf8').trim());
              } catch {
                return '(no audit output captured)';
              }
            };
            const uvOutput = readAudit('uv-audit.txt');
            const bunOutput = readAudit('bun-audit.txt');
            const uvStatus = process.env.UV_STATUS || 'error';
            const bunStatus = process.env.BUN_STATUS || 'error';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().split('T')[0];
            const anyError = uvStatus === 'error' || bunStatus === 'error';
            const allClean = uvStatus === 'clean' && bunStatus === 'clean';

            await core.summary
              .addHeading('Dependency advisory triage')
              .addRaw(`uv audit: ${uvStatus} — bun audit: ${bunStatus}\n\n[View run](${runUrl})`)
              .write();

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'dependency-advisories',
              state: 'open',
              per_page: 100
            });

            if (anyError) {
              // Tooling errors keep the run red (the failed audit step already
              // failed the job); no advisory issue is filed from a failed audit.
              core.setFailed(`Audit tooling error (uv audit: ${uvStatus}, bun audit: ${bunStatus}) — see the failed steps in this run. Advisory findings are not triaged from a failed audit (ADR-0012).`);
              return;
            }

            if (allClean) {
              if (existing.data.length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.data[0].number,
                  body: `Re-audit clean on ${date} (ignores unchanged).\n[View run](${runUrl})`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.data[0].number,
                  state: 'closed',
                  state_reason: 'completed'
                });
                core.info('Advisories resolved — closed the open triage issue.');
              } else {
                core.info('No advisories found; nothing to file.');
              }
              return;
            }

            // GitHub comments cap at 65536 chars — keep each section well under.
            const cap = (text) => text.length > 25000 ? `${text.slice(0, 25000)}\n…(truncated — see the full output in the run log)` : text;
            const section = (name, status, text) => status === 'clean'
              ? `### ${name}\n\nClean (no advisories reported).`
              : `### ${name}\n\n\`\`\`\n${cap(text)}\n\`\`\``;
            const body = [
              `Dependency advisories found by the advisory triage audit on **${date}** (ADR-0012).`,
              '',
              'These are advisory findings for human triage — main stays green. Update the dependency, add a justified ignore, or accept the risk in this issue.',
              '',
              section('Backend (uv audit)', uvStatus, uvOutput),
              '',
              section('Frontend (bun audit)', bunStatus, bunOutput),
              '',
              `[View run](${runUrl})`
            ].join('\n');

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still flagged on ${date}:\n\n${body}`
              });
              core.info(`Updated existing triage issue #${existing.data[0].number}.`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Dependency advisories need triage (${date})`,
                labels: ['dependency-advisories'],
                body
              });
              core.info('Filed a new advisory triage issue.');
            }

  openapi-freshness:
    # Regenerate the API contract and the generated TS client from app code and
    # fail on drift (design D4). Cross-stack job (python + bun + java) kept
    # separate from backend-quality/frontend-quality; runs on PRs touching
    # backend/frontend and on main pushes (including the weekly schedule
    # refresh, whose ref is main).
    needs: [prepare]
    if: needs.prepare.outputs.backend == 'true' || needs.prepare.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Contract export: python env only, same install path as backend-quality.
      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Export OpenAPI contract
        id: export
        run: cd backend && uv sync --dev && uv run python scripts/export_openapi.py

      - name: Check contract freshness
        id: contract-diff
        # Diff against HEAD, not the index: a compromised generation step could
        # stage its own output, and a plain index diff would then pass.
        run: git diff --exit-code HEAD -- backend/openapi.yaml

      # Client regeneration: bun for the devDep CLI, Java for the generator jar.
      # setup-java pins the JVM version explicitly — GitHub runners pre-cache
      # Temurin, but the exact version drifts with runner images, and generator
      # output must be reproducible across local/CI (design D6).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Verify Bun runtime
        run: bun --version

      # generate:client stamps output via `node scripts/stamp-generated.mjs`;
      # don't rely on a runner-preinstalled node (matches frontend-quality pin).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java runtime
        run: java --version

      # scripts/verify-generator-jar.mjs caches the sha256-verified generator
      # jar here; a cache hit makes codegen run on the pre-verified jar with no
      # network fetch. Key includes the pinned sha256, so a re-pin busts it.
      - name: Cache verified generator jar
        uses: actions/cache@v4
        with:
          path: frontend/.generator-jar-cache
          key: generator-jar-7.27.0-db9c4b73

      - name: Install dependencies
        run: cd frontend && bun install --frozen-lockfile

      # Config-driven invocation: frontend/openapitools.json pins the generator
      # version and declares input/output. (`-c` on the CLI means a generator
      # options file, not this wrapper config — flags must stay off.)
      # generate:client = sha256-verified jar (verify-generator-jar.mjs passes
      # it via --custom-generator) + @ts-nocheck stamp, identical to local
      # `just openapi-generate`, so CI regenerates byte-identical output.
      - name: Generate API client
        id: generate
        run: cd frontend && bun run generate:client

      # git add -N makes newly generated (untracked) files visible to git diff.
      # Diff against HEAD, not the index: a compromised generation step could
      # stage its own output, and a plain index diff would then pass.
      - name: Check client freshness
        id: client-diff
        run: |
          git add -N frontend/src/lib/api/generated
          git diff --exit-code HEAD -- frontend/src/lib/api/generated

      - name: Freshness failure summary
        if: failure()
        run: |
          echo "## ❌ OpenAPI Freshness Check Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.contract-diff.outcome }}" == "failure" ]]; then
            echo "::error::backend/openapi.yaml is stale. Regenerate with: cd backend && uv run python scripts/export_openapi.py"
            echo "### Stale: \`backend/openapi.yaml\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`diff" >> "$GITHUB_STEP_SUMMARY"
            # Indent each diff line 4 spaces: the diff is PR-influenced and a
            # ``` line in it would otherwise close/insert fences in the summary.
            git diff -- backend/openapi.yaml | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${{ steps.client-diff.outcome }}" == "failure" ]]; then
            echo "::error::frontend/src/lib/api/generated is stale. Regenerate with: just openapi-generate (or: cd frontend && bun run generate:client)"
            echo "### Stale: \`frontend/src/lib/api/generated\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            git add -N frontend/src/lib/api/generated || true
            echo "\`\`\`diff" >> "$GITHUB_STEP_SUMMARY"
            git diff -- frontend/src/lib/api/generated | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${{ steps.export.outcome }}" == "failure" || "${{ steps.generate.outcome }}" == "failure" ]]; then
            echo "### Regeneration step failed before a diff could be produced" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the failed step's logs (dependency install, export script, or generator invocation) — this is infrastructure/config failure, not artifact drift." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Freshness success summary
        if: success()
        run: |
          echo "## ✅ OpenAPI Freshness" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ \`backend/openapi.yaml\` matches the FastAPI app (no drift)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ \`frontend/src/lib/api/generated\` matches the contract (no drift)" >> "$GITHUB_STEP_SUMMARY"

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sfL --retry 3 --retry-delay 2 --retry-all-errors \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        id: gitleaks
        run: gitleaks detect --verbose .

      - name: Secrets scan summary
        if: failure()
        run: |
          if [[ "${{ steps.gitleaks.outcome }}" == "failure" ]]; then
            echo "::error::Potential secrets detected in git history. Review the gitleaks output above and rotate any exposed credentials immediately."
            echo "## ❌ Secrets Scan Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Action required:** Review findings above and rotate any exposed credentials." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Secrets scan job failed before gitleaks could run — tool install or infrastructure issue, not a secrets finding. Re-run the job and check the logs."
            echo "## ❌ Secrets Scan Failed Before Scanning" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The failure happened in an earlier step (e.g. gitleaks download). Check the job logs and re-run before investigating secrets." >> "$GITHUB_STEP_SUMMARY"
          fi

  sast:
    needs: [prepare]
    if: needs.prepare.outputs.backend == 'true' || needs.prepare.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run semgrep SAST
        id: semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "auto,p/owasp-top-ten,p/fastapi,p/jwt,p/xss"
          baseline-commit: ${{ github.base_ref || 'main' }}
          generateSarif: "1"

      - name: Upload semgrep results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json

      - name: SAST summary
        if: failure()
        run: |
          if [[ "${{ steps.semgrep.outcome }}" == "failure" ]]; then
            echo "::error::Semgrep SAST found security issues. Review the findings in the logs and the uploaded semgrep-results artifact."
            echo "## ❌ SAST Scan Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Download the \`semgrep-results\` artifact for full details." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::SAST job failed before semgrep could run — tool or infrastructure issue, not a security finding. Re-run the job and check the logs."
            echo "## ❌ SAST Scan Failed Before Scanning" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The failure happened in an earlier step. Check the job logs and re-run before treating this as security findings." >> "$GITHUB_STEP_SUMMARY"
          fi

  sca:
    needs: [prepare]
    if: needs.prepare.outputs.backend == 'true' || needs.prepare.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Verify Bun runtime
        run: bun --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: |
          cd backend && uv sync --dev
          cd "${GITHUB_WORKSPACE}" && cd frontend && bun install --frozen-lockfile

      - name: Cache osv-scanner
        id: cache-osv
        uses: actions/cache@v4
        with:
          path: ~/go/bin/osv-scanner
          key: osv-scanner-v1.9.2

      - name: Install osv-scanner
        if: steps.cache-osv.outputs.cache-hit != 'true'
        run: go install github.com/google/osv-scanner/cmd/osv-scanner@v1.9.2

      - name: Install trivy
        run: |
          TRIVY_VERSION=0.76.2
          curl -sfL --retry 3 --retry-delay 2 --retry-all-errors \
            -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          trivy --version

      - name: Run SCA scan
        id: sca-scan
        run: |
          ~/go/bin/osv-scanner scan -r .
          trivy fs --severity CRITICAL,HIGH --scanners vuln --format json --output trivy-results.json .

      - name: Upload SCA results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-results
          path: |
            osv-results.json
            trivy-results.json

      - name: SCA summary
        if: failure()
        run: |
          if [[ "${{ steps.sca-scan.outcome }}" == "failure" ]]; then
            echo "::error::SCA scan found vulnerable dependencies. Check osv-scanner and trivy output above, and the uploaded sca-results artifact."
            echo "## ❌ SCA Scan Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Run 'just sca' locally to reproduce. Download the \`sca-results\` artifact for full details." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::SCA job failed before scanning — dependency install or tool download issue, not a vulnerability finding. Re-run the job and check the logs."
            echo "## ❌ SCA Scan Failed Before Scanning" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The failure happened in an earlier step (e.g. dependency or scanner install). Check the job logs and re-run before treating this as vulnerabilities." >> "$GITHUB_STEP_SUMMARY"
          fi

  dast-smoke:
    needs: [prepare]
    if: needs.prepare.outputs.backend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Cache nuclei binary
        id: cache-nuclei
        uses: actions/cache@v4
        with:
          path: ~/go/bin/nuclei
          key: nuclei-v3.7.1-go

      - name: Install nuclei
        if: steps.cache-nuclei.outputs.cache-hit != 'true'
        run: go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@v3.7.1

      - name: Install dependencies
        run: cd backend && uv sync --dev

      - name: Start backend
        run: cd backend && uv run uvicorn app.api:app --host 0.0.0.0 --port 8080 &
        env:
          DATABASE_URL: "sqlite:///./test.db"

      - name: Wait for backend
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/15)"
            sleep 2
          done
          echo "::error::Backend did not become ready in 30 seconds — DAST smoke test cannot proceed"
          exit 1

      - name: Run DAST smoke test
        id: nuclei-scan
        run: ~/go/bin/nuclei -t security/nuclei-templates/ -u http://localhost:8080 -j -o nuclei-results.json

      - name: Check for HIGH/CRITICAL findings
        if: always() && steps.nuclei-scan.outcome != 'skipped'
        run: |
          if [ -f nuclei-results.json ]; then
            HIGH_CRIT=$(grep -c '"severity":"critical"\|"severity":"high"' nuclei-results.json 2>/dev/null | tr -d '[:space:]' || echo "0")
            if [ "$HIGH_CRIT" -gt 0 ]; then
              echo "::error::$HIGH_CRIT HIGH/CRITICAL DAST findings detected — review nuclei-results.json"
              exit 1
            fi
            echo "No HIGH/CRITICAL DAST findings"
          else
            echo "::error::No nuclei results file — DAST scan may have failed to execute"
            exit 1
          fi

      - name: Upload DAST results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-smoke-results
          path: nuclei-results.json

      - name: DAST smoke summary
        if: failure()
        run: |
          echo "## ❌ DAST Smoke Test Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.nuclei-scan.outcome }}" == "failure" ]]; then
            echo "Nuclei scan found vulnerabilities. Download \`dast-smoke-results\` artifact for details." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "DAST smoke test could not complete — check if the backend started successfully." >> "$GITHUB_STEP_SUMMARY"
          fi

  dast-full:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Cache nuclei binary
        id: cache-nuclei
        uses: actions/cache@v4
        with:
          path: ~/go/bin/nuclei
          key: nuclei-v3.7.1-go

      - name: Install nuclei
        if: steps.cache-nuclei.outputs.cache-hit != 'true'
        run: go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@v3.7.1

      - name: Update nuclei templates
        run: ~/go/bin/nuclei -update-templates -ud ~/nuclei-templates

      - name: Install dependencies
        run: cd backend && uv sync --dev

      - name: Start backend
        run: cd backend && uv run uvicorn app.api:app --host 0.0.0.0 --port 8080 &
        env:
          DATABASE_URL: "sqlite:///./test.db"

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "::error::Backend did not become ready in 60 seconds — DAST full scan cannot proceed"
          exit 1

      - name: Run DAST scan
        id: nuclei-scan
        run: ~/go/bin/nuclei -t ~/nuclei-templates/ -u http://localhost:8080 -j -o nuclei-results.json

      - name: Check for HIGH/CRITICAL findings
        if: always() && steps.nuclei-scan.outcome != 'skipped'
        run: |
          if [ -f nuclei-results.json ]; then
            HIGH_CRIT=$(grep -c '"severity":"critical"\|"severity":"high"' nuclei-results.json 2>/dev/null | tr -d '[:space:]' || echo "0")
            if [ "$HIGH_CRIT" -gt 0 ]; then
              echo "::error::$HIGH_CRIT HIGH/CRITICAL DAST findings detected — review nuclei-results.json"
              exit 1
            fi
            echo "No HIGH/CRITICAL DAST findings"
          fi

      - name: Upload nuclei results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuclei-results
          path: nuclei-results.json

  docker-build:
    needs: [prepare, backend-quality, frontend-quality, frontend-fallow, dast-smoke]
    if: >-
      always() &&
      ((needs.prepare.outputs.backend == 'true' || needs.prepare.outputs.frontend == 'true') &&
      (needs.backend-quality.result == 'success' || needs.backend-quality.result == 'skipped') &&
      (needs.frontend-quality.result == 'success' || needs.frontend-quality.result == 'skipped') &&
      (needs.frontend-fallow.result == 'success' || needs.frontend-fallow.result == 'skipped') &&
      (needs.dast-smoke.result == 'success' || needs.dast-smoke.result == 'skipped') ||
      github.ref == 'refs/heads/main' ||
      github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream results
        if: >-
          needs.backend-quality.result == 'failure' ||
          needs.frontend-quality.result == 'failure' ||
          needs.frontend-fallow.result == 'failure' ||
          needs.dast-smoke.result == 'failure'
        run: |
          echo "::warning::Docker build proceeding despite upstream failures (main branch or scheduled run):"
          [[ "${{ needs.backend-quality.result }}" == "failure" ]] && echo "::warning::backend-quality: failed" || true
          [[ "${{ needs.frontend-quality.result }}" == "failure" ]] && echo "::warning::frontend-quality: failed" || true
          [[ "${{ needs.frontend-fallow.result }}" == "failure" ]] && echo "::warning::frontend-fallow: failed" || true
          [[ "${{ needs.dast-smoke.result }}" == "failure" ]] && echo "::warning::dast-smoke: failed" || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache backend Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-backend
          key: ${{ runner.os }}-buildx-backend-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-backend-

      - name: Cache frontend Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-frontend
          key: ${{ runner.os }}-buildx-frontend-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-frontend-

      - name: Build backend Docker image
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: votecatcher-backend
          build-args: APT_CACHE_BUST=${{ github.run_id }}
          cache-from: type=local,src=/tmp/.buildx-cache-backend
          cache-to: type=local,dest=/tmp/.buildx-cache-backend-new,mode=max
      - name: Move backend cache
        run: |
          rm -rf /tmp/.buildx-cache-backend
          mv /tmp/.buildx-cache-backend-new /tmp/.buildx-cache-backend

      - name: Build frontend Docker image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: votecatcher-frontend
          cache-from: type=local,src=/tmp/.buildx-cache-frontend
          cache-to: type=local,dest=/tmp/.buildx-cache-frontend-new,mode=max

      - name: Move frontend cache
        run: |
          rm -rf /tmp/.buildx-cache-frontend
          mv /tmp/.buildx-cache-frontend-new /tmp/.buildx-cache-frontend
      - name: Build backend production image
        id: build-backend-prod
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          load: true
          tags: votecatcher-backend:prod
          build-args: APT_CACHE_BUST=${{ github.run_id }}
      - name: Build frontend production image
        id: build-frontend-prod
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          load: true
          tags: votecatcher-frontend:prod
          build-args: |
            ADAPTER=node
            PUBLIC_API_URL=http://localhost:8080
            PUBLIC_DEMO_MODE=false
            DEMO_MODE=false
            OCR_PROVIDER_NAME=openai
            OCR_PROVIDER_MODEL=gpt-4o-mini
            OCR_PROVIDER_API_KEY=
            DATABASE_URL=postgresql://user:pass@localhost:5432/votecatcher

      - name: Run Trivy on backend
        id: trivy-backend
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: votecatcher-backend
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Run Trivy on frontend
        id: trivy-frontend
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: votecatcher-frontend
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Run Trivy on backend production image
        id: trivy-backend-prod
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: votecatcher-backend:prod
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Run Trivy on frontend production image
        id: trivy-frontend-prod
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: votecatcher-frontend:prod
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Docker build and scan failure summary
        if: failure()
        run: |
          FAILED=""
          PASSED=""

          if [[ "${{ steps.build-backend.outcome }}" == "success" ]]; then PASSED="$PASSED\n- ✅ Backend image build"; else FAILED="$FAILED\n- ❌ Backend image build"; fi
          if [[ "${{ steps.build-frontend.outcome }}" == "success" ]]; then PASSED="$PASSED\n- ✅ Frontend image build"; else FAILED="$FAILED\n- ❌ Frontend image build"; fi
          if [[ "${{ steps.build-backend-prod.outcome }}" == "success" ]]; then PASSED="$PASSED\n- ✅ Backend production image build"; else FAILED="$FAILED\n- ❌ Backend production image build"; fi
          if [[ "${{ steps.build-frontend-prod.outcome }}" == "success" ]]; then PASSED="$PASSED\n- ✅ Frontend production image build"; else FAILED="$FAILED\n- ❌ Frontend production image build"; fi
          if [[ "${{ steps.trivy-backend.outcome }}" == "success" ]]; then PASSED="$PASSED\n- ✅ Backend Trivy scan"; else FAILED="$FAILED\n- ❌ Backend Trivy scan (CRITICAL/HIGH CVEs)"; fi
          if [[ "${{ steps.trivy-frontend.outcome }}" == "success" ]]; then PASSED="$PASSED\n- ✅ Frontend Trivy scan"; else FAILED="$FAILED\n- ❌ Frontend Trivy scan (CRITICAL/HIGH CVEs)"; fi
          if [[ "${{ steps.trivy-backend-prod.outcome }}" == "success" ]]; then PASSED="$PASSED\n- ✅ Backend production Trivy scan"; else FAILED="$FAILED\n- ❌ Backend production Trivy scan (CRITICAL/HIGH CVEs)"; fi
          if [[ "${{ steps.trivy-frontend-prod.outcome }}" == "success" ]]; then PASSED="$PASSED\n- ✅ Frontend production Trivy scan"; else FAILED="$FAILED\n- ❌ Frontend production Trivy scan (CRITICAL/HIGH CVEs)"; fi

          FIRST_FAIL=$(echo -e "$FAILED" | grep -m1 "❌" || true)
          echo "::error::Docker build and scan failed:$FIRST_FAIL"

          echo "## ❌ Docker Build & Scan Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Failed" >> "$GITHUB_STEP_SUMMARY"
          echo -e "$FAILED" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Passed" >> "$GITHUB_STEP_SUMMARY"
          echo -e "$PASSED" >> "$GITHUB_STEP_SUMMARY"

      - name: Docker build and scan success summary
        if: success()
        run: |
          echo "## ✅ Docker Build & Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Backend image build" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Frontend image build" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Backend production image build" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Frontend production image build" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Backend Trivy scan" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Frontend Trivy scan" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Backend production Trivy scan" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Frontend production Trivy scan" >> "$GITHUB_STEP_SUMMARY"
