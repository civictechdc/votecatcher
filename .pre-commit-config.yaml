repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Frontend lint via the project's own oxlint (bun). The mirrors-oxlint
  # remote repo bootstraps its own node env via nodeenv, which crashes with
  # `ValueError: invalid literal for int() with base 10: '0-alpha'`, forcing
  # SKIP=oxlint on every commit. This repo is bun-first, so run the same
  # lint CI runs (`cd frontend && bun run lint`) — full-project, no nodeenv.
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint (frontend)
        entry: bun run --cwd frontend lint
        language: system
        pass_filenames: false
        files: ^frontend/

  # Same rationale as the oxlint hook above: run the project's own oxfmt
  # (`cd frontend && bun run fmt`, which honors .oxfmtignore) so formatting
  # is fixed at commit time instead of failing the CI lint step later. The
  # hook rewrites unformatted files; pre-commit then aborts the commit so
  # the fixes can be re-staged.
  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt (frontend)
        entry: bun run --cwd frontend fmt
        language: system
        pass_filenames: false
        files: ^frontend/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      # Generated client output contains trailing whitespace and is exempted
      # from repo-wide fixers: rewriting it would trip the CI freshness diff
      # (regenerated files must stay byte-identical to the committed ones).
      - id: end-of-file-fixer
        exclude: ^frontend/src/lib/api/generated/
      - id: trailing-whitespace
        exclude: ^frontend/src/lib/api/generated/

  # Ensure Makefile stays in sync with justfile
  - repo: local
    hooks:
      - id: justfile-makefile-sync
        name: justfile-makefile-sync
        entry: python scripts/just-to-make.py --check
        language: system
        pass_filenames: false
        files: ^(justfile|Makefile)$

      - id: docs-validation
        name: Validate documentation accuracy
        entry: bash scripts/validate-docs.sh
        language: system
        files: ^docs/
        pass_filenames: false

      - id: reject-internal-dirs
        name: Reject internal directories
        entry: bash scripts/reject-internal-dirs.sh
        language: system
        pass_filenames: false
        always_run: true
