  /upload/petition:
    post:
      description: "Upload petition PDF with pre-cropping.\n\nArgs:\n        campaign_id:\
        \ Campaign ID to associate with\n        file: Uploaded PDF file\n       \
        \ region: Region for crop coordinates (default: DC)\n        session: Database\
        \ session\n\nReturns:\n        Upload confirmation with scan ID and crop count\n\
        \nRaises:\n        HTTPException: 400 if file validation fails\n        HTTPException:\
        \ 404 if campaign not found"
      operationId: upload_petition_upload_petition_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_petition_upload_petition_post'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetitionUploadResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Upload Petition
      tags:
      - upload
