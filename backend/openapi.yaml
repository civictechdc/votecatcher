components:
  schemas:
    Body_upload_petition_upload_petition_post:
      properties:
        campaign_id:
          title: Campaign Id
          type: string
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
        region:
          default: DC
          title: Region
          type: string
      required:
      - campaign_id
      - file
      title: Body_upload_petition_upload_petition_post
      type: object
    Body_upload_voter_list_upload_voter_list_post:
      properties:
        campaign_id:
          title: Campaign Id
          type: string
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
      required:
      - campaign_id
      - file
      title: Body_upload_voter_list_upload_voter_list_post
      type: object
    CampaignListResponse:
      description: Response schema for campaign list.
      properties:
        campaigns:
          items:
            $ref: '#/components/schemas/CampaignResponse'
          title: Campaigns
          type: array
        total:
          title: Total
          type: integer
      required:
      - campaigns
      - total
      title: CampaignListResponse
      type: object
    CampaignMatchPrediction:
      description: Schema for a single match prediction.
      properties:
        confidence:
          $ref: '#/components/schemas/ConfidenceLevel'
        rank:
          title: Rank
          type: integer
        similarityScore:
          title: Similarityscore
          type: number
        voterAddress:
          title: Voteraddress
          type: string
        voterName:
          title: Votername
          type: string
      required:
      - rank
      - voterName
      - voterAddress
      - similarityScore
      - confidence
      title: CampaignMatchPrediction
      type: object
    CampaignMetricsResponse:
      description: Response schema for campaign metrics.
      properties:
        highConfidence:
          title: Highconfidence
          type: integer
        lastJob:
          anyOf:
          - $ref: '#/components/schemas/LastJobInfo'
          - type: 'null'
        lowConfidence:
          title: Lowconfidence
          type: integer
        mediumConfidence:
          title: Mediumconfidence
          type: integer
        processed:
          title: Processed
          type: integer
        progressPercentage:
          title: Progresspercentage
          type: number
        totalSignatures:
          title: Totalsignatures
          type: integer
        voterListCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Voterlistcount
      required:
      - totalSignatures
      - processed
      - highConfidence
      - mediumConfidence
      - lowConfidence
      - progressPercentage
      - lastJob
      - voterListCount
      title: CampaignMetricsResponse
      type: object
    CampaignResponse:
      description: Response schema for campaign.
      properties:
        createdAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Createdat
        id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Id
        region:
          anyOf:
          - type: string
          - type: 'null'
          title: Region
        regionId:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Regionid
        title:
          title: Title
          type: string
        uniqueName:
          title: Uniquename
          type: string
        updatedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updatedat
        year:
          title: Year
          type: string
      required:
      - id
      - uniqueName
      - title
      - year
      - region
      - regionId
      - createdAt
      - updatedAt
      title: CampaignResponse
      type: object
    CampaignResultResponse:
      description: Response schema for a single result.
      properties:
        cropCoordinates:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Cropcoordinates
        cropId:
          title: Cropid
          type: integer
        documentName:
          default: ''
          title: Documentname
          type: string
        entryCoordinates:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Entrycoordinates
        extractedAddress:
          title: Extractedaddress
          type: string
        extractedName:
          title: Extractedname
          type: string
        jobId:
          title: Jobid
          type: integer
        ocrResultId:
          title: Ocrresultid
          type: integer
        pageNumber:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pagenumber
        predictions:
          items:
            $ref: '#/components/schemas/CampaignMatchPrediction'
          title: Predictions
          type: array
        scanId:
          anyOf:
          - type: integer
          - type: 'null'
          title: Scanid
        thumbnailUrl:
          title: Thumbnailurl
          type: string
      required:
      - ocrResultId
      - extractedName
      - extractedAddress
      - cropId
      - jobId
      - thumbnailUrl
      - predictions
      title: CampaignResultResponse
      type: object
    CampaignResultsListResponse:
      description: Response schema for paginated campaign results.
      properties:
        nextCursor:
          anyOf:
          - type: integer
          - type: 'null'
          title: Nextcursor
        pageSize:
          title: Pagesize
          type: integer
        results:
          items:
            $ref: '#/components/schemas/CampaignResultResponse'
          title: Results
          type: array
        total:
          title: Total
          type: integer
      required:
      - results
      - total
      - pageSize
      title: CampaignResultsListResponse
      type: object
    ConfidenceLevel:
      description: Confidence levels for match results.
      enum:
      - HIGH
      - MEDIUM
      - LOW
      title: ConfidenceLevel
      type: string
    ConnectionTestResult:
      description: Result of connection test.
      properties:
        message:
          title: Message
          type: string
        project_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Ref
        success:
          title: Success
          type: boolean
      required:
      - success
      - message
      title: ConnectionTestResult
      type: object
    CreateCampaignRequest:
      description: Request schema for creating campaign.
      properties:
        name:
          maxLength: 255
          minLength: 1
          pattern: ^[^<>\"';&]+$
          title: Name
          type: string
        region:
          default: DC
          maxLength: 10
          title: Region
          type: string
        year:
          maximum: 2100.0
          minimum: 1900.0
          title: Year
          type: integer
      required:
      - name
      - year
      title: CreateCampaignRequest
      type: object
    CreateJobRequest:
      description: Request schema for creating a matcher job.
      properties:
        campaignId:
          format: uuid
          title: Campaignid
          type: string
        forceReprocess:
          default: false
          title: Forcereprocess
          type: boolean
        providerModel:
          anyOf:
          - type: string
          - type: 'null'
          title: Providermodel
        providerName:
          anyOf:
          - type: string
          - type: 'null'
          title: Providername
        scanIds:
          default: []
          items:
            type: integer
          title: Scanids
          type: array
      required:
      - campaignId
      title: CreateJobRequest
      type: object
    CreateSessionRequest:
      description: Request schema for saving a session.
      properties:
        campaignId:
          anyOf:
          - type: string
          - type: 'null'
          title: Campaignid
        name:
          title: Name
          type: string
        sessionType:
          default: REAL
          title: Sessiontype
          type: string
        snapshotData:
          additionalProperties: true
          default: {}
          title: Snapshotdata
          type: object
      required:
      - name
      title: CreateSessionRequest
      type: object
    DatabaseStatus:
      description: Current database configuration status.
      properties:
        configured:
          title: Configured
          type: boolean
        connected:
          title: Connected
          type: boolean
        message:
          title: Message
          type: string
        type:
          description: sqlite, postgres, or supabase
          title: Type
          type: string
      required:
      - configured
      - type
      - connected
      - message
      title: DatabaseStatus
      type: object
    DeleteVoterListResponse:
      description: Response schema for deleting voter list.
      properties:
        deletedCount:
          title: Deletedcount
          type: integer
        success:
          title: Success
          type: boolean
      required:
      - deletedCount
      - success
      title: DeleteVoterListResponse
      type: object
    DeletedTableCounts:
      description: Typed sub-model for table deletion counts.
      properties:
        campaigns:
          default: 0
          title: Campaigns
          type: integer
        matchResults:
          default: 0
          title: Matchresults
          type: integer
        matcherJobs:
          default: 0
          title: Matcherjobs
          type: integer
        ocrJobs:
          default: 0
          title: Ocrjobs
          type: integer
        ocrResults:
          default: 0
          title: Ocrresults
          type: integer
        petitionCrops:
          default: 0
          title: Petitioncrops
          type: integer
        petitionScans:
          default: 0
          title: Petitionscans
          type: integer
      title: DeletedTableCounts
      type: object
    FeatureFlagsResponse:
      properties:
        alwaysBatchOcr:
          title: Alwaysbatchocr
          type: boolean
        betaFeatures:
          title: Betafeatures
          type: boolean
        debugMode:
          title: Debugmode
          type: boolean
        demoMode:
          title: Demomode
          type: boolean
        demoReset:
          title: Demoreset
          type: boolean
        simulationMode:
          title: Simulationmode
          type: boolean
      required:
      - simulationMode
      - betaFeatures
      - debugMode
      - demoMode
      - demoReset
      - alwaysBatchOcr
      title: FeatureFlagsResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    JobListResponse:
      description: Response schema for listing jobs.
      properties:
        jobs:
          items:
            $ref: '#/components/schemas/JobResponse'
          title: Jobs
          type: array
        total:
          title: Total
          type: integer
      required:
      - jobs
      - total
      title: JobListResponse
      type: object
    JobResponse:
      description: Response schema for job status.
      properties:
        cachedOcrCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Cachedocrcount
        campaignId:
          format: uuid
          title: Campaignid
          type: string
        campaignName:
          anyOf:
          - type: string
          - type: 'null'
          title: Campaignname
        createdAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Createdat
        endedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Endedat
        errorMessage:
          anyOf:
          - type: string
          - type: 'null'
          title: Errormessage
        forceReprocess:
          default: false
          title: Forcereprocess
          type: boolean
        isOrphaned:
          default: false
          title: Isorphaned
          type: boolean
        jobId:
          title: Jobid
          type: integer
        matchingDurationSeconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Matchingdurationseconds
        newOcrCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Newocrcount
        ocrDurationSeconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Ocrdurationseconds
        providerModel:
          anyOf:
          - type: string
          - type: 'null'
          title: Providermodel
        providerName:
          anyOf:
          - type: string
          - type: 'null'
          title: Providername
        startedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Startedat
        status:
          title: Status
          type: string
        updatedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updatedat
      required:
      - jobId
      - status
      - campaignId
      title: JobResponse
      type: object
    JobsStatus:
      description: Jobs status sub-object.
      properties:
        active:
          title: Active
          type: integer
        total:
          title: Total
          type: integer
      required:
      - total
      - active
      title: JobsStatus
      type: object
    LastJobInfo:
      description: Typed sub-model for last job info in metrics.
      properties:
        completedAt:
          anyOf:
          - type: string
          - type: 'null'
          title: Completedat
        id:
          title: Id
          type: integer
        status:
          title: Status
          type: string
      required:
      - id
      - status
      - completedAt
      title: LastJobInfo
      type: object
    LlmProviderConfigCreate:
      description: Schema for creating/updating provider config.
      properties:
        api_key:
          title: Api Key
          type: string
        model:
          title: Model
          type: string
      required:
      - api_key
      - model
      title: LlmProviderConfigCreate
      type: object
    LlmProviderConfigRead:
      description: Schema for reading provider config (no API key).
      properties:
        is_configured:
          title: Is Configured
          type: boolean
        last_validated:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Validated
        model:
          title: Model
          type: string
        provider:
          title: Provider
          type: string
      required:
      - provider
      - model
      - is_configured
      - last_validated
      title: LlmProviderConfigRead
      type: object
    LlmProviderTestResult:
      description: Schema for provider test result.
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        models:
          default: []
          items:
            type: string
          title: Models
          type: array
        valid:
          title: Valid
          type: boolean
      required:
      - valid
      title: LlmProviderTestResult
      type: object
    MatchPrediction:
      properties:
        confidence:
          $ref: '#/components/schemas/ConfidenceLevel'
        rank:
          title: Rank
          type: integer
        similarityScore:
          title: Similarityscore
          type: number
        voterAddress:
          title: Voteraddress
          type: string
        voterName:
          title: Votername
          type: string
      required:
      - rank
      - voterName
      - voterAddress
      - similarityScore
      - confidence
      title: MatchPrediction
      type: object
    PetitionScanListResponse:
      description: Response schema for listing petition scans.
      properties:
        scans:
          items:
            $ref: '#/components/schemas/PetitionScanResponse'
          title: Scans
          type: array
        total:
          title: Total
          type: integer
      required:
      - scans
      - total
      title: PetitionScanListResponse
      type: object
    PetitionScanResponse:
      description: Response schema for a petition scan.
      properties:
        fileSize:
          anyOf:
          - type: integer
          - type: 'null'
          title: Filesize
        id:
          title: Id
          type: integer
        originalFilename:
          title: Originalfilename
          type: string
        pageCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pagecount
        uploadedAt:
          format: date-time
          title: Uploadedat
          type: string
      required:
      - id
      - originalFilename
      - fileSize
      - pageCount
      - uploadedAt
      title: PetitionScanResponse
      type: object
    PetitionUploadResponse:
      description: Response schema for petition upload.
      properties:
        cropCount:
          title: Cropcount
          type: integer
        message:
          title: Message
          type: string
        scanId:
          title: Scanid
          type: integer
      required:
      - message
      - scanId
      - cropCount
      title: PetitionUploadResponse
      type: object
    PetitionsStatus:
      description: Petitions status sub-object.
      properties:
        exists:
          title: Exists
          type: boolean
        fileCount:
          title: Filecount
          type: integer
        signatureCount:
          title: Signaturecount
          type: integer
      required:
      - exists
      - fileCount
      - signatureCount
      title: PetitionsStatus
      type: object
    PrebakedSession:
      description: Pre-baked demo session metadata.
      properties:
        description:
          title: Description
          type: string
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
      required:
      - id
      - name
      - description
      title: PrebakedSession
      type: object
    PrebakedSessionList:
      description: List of pre-baked sessions.
      properties:
        sessions:
          items:
            $ref: '#/components/schemas/PrebakedSession'
          title: Sessions
          type: array
      required:
      - sessions
      title: PrebakedSessionList
      type: object
    ProvisionResult:
      description: Result of Supabase provisioning.
      properties:
        message:
          title: Message
          type: string
        success:
          title: Success
          type: boolean
        tables_created:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tables Created
      required:
      - success
      - message
      title: ProvisionResult
      type: object
    RegionListResponse:
      description: Response schema for listing regions.
      properties:
        regions:
          items:
            $ref: '#/components/schemas/RegionSummary'
          title: Regions
          type: array
      required:
      - regions
      title: RegionListResponse
      type: object
    RegionSummary:
      description: Summary of a region with field spec.
      properties:
        id:
          format: uuid
          title: Id
          type: string
        key:
          title: Key
          type: string
        name:
          title: Name
          type: string
      required:
      - key
      - name
      - id
      title: RegionSummary
      type: object
    ResetDataResponse:
      description: Response for data reset operation.
      properties:
        deletedCounts:
          $ref: '#/components/schemas/DeletedTableCounts'
        message:
          title: Message
          type: string
      required:
      - deletedCounts
      - message
      title: ResetDataResponse
      type: object
    ResultResponse:
      properties:
        cropCoordinates:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Cropcoordinates
        cropId:
          title: Cropid
          type: integer
        documentName:
          default: ''
          title: Documentname
          type: string
        entryCoordinates:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Entrycoordinates
        extractedText:
          title: Extractedtext
          type: string
        ocrResultId:
          title: Ocrresultid
          type: integer
        pageNumber:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pagenumber
        predictions:
          items:
            $ref: '#/components/schemas/MatchPrediction'
          title: Predictions
          type: array
        scanId:
          anyOf:
          - type: integer
          - type: 'null'
          title: Scanid
        thumbnailUrl:
          title: Thumbnailurl
          type: string
      required:
      - ocrResultId
      - extractedText
      - cropId
      - thumbnailUrl
      - predictions
      title: ResultResponse
      type: object
    ResultsListResponse:
      properties:
        nextCursor:
          anyOf:
          - type: integer
          - type: 'null'
          title: Nextcursor
        pageSize:
          title: Pagesize
          type: integer
        results:
          items:
            $ref: '#/components/schemas/ResultResponse'
          title: Results
          type: array
        total:
          title: Total
          type: integer
      required:
      - results
      - total
      - pageSize
      title: ResultsListResponse
      type: object
    SessionListResponse:
      description: Response schema for listing sessions.
      properties:
        sessions:
          items:
            $ref: '#/components/schemas/SessionResponse'
          title: Sessions
          type: array
        total:
          title: Total
          type: integer
      required:
      - sessions
      - total
      title: SessionListResponse
      type: object
    SessionResponse:
      description: Response schema for session.
      properties:
        campaignId:
          anyOf:
          - type: string
          - type: 'null'
          title: Campaignid
        createdAt:
          format: date-time
          title: Createdat
          type: string
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
        sessionType:
          title: Sessiontype
          type: string
        snapshotData:
          additionalProperties: true
          title: Snapshotdata
          type: object
        updatedAt:
          format: date-time
          title: Updatedat
          type: string
      required:
      - id
      - name
      - campaignId
      - sessionType
      - snapshotData
      - createdAt
      - updatedAt
      title: SessionResponse
      type: object
    SettingsResponse:
      description: Settings response.
      properties:
        features:
          $ref: '#/components/schemas/FeatureFlagsResponse'
        ocrModel:
          anyOf:
          - type: string
          - type: 'null'
          title: Ocrmodel
        ocrProvider:
          anyOf:
          - type: string
          - type: 'null'
          title: Ocrprovider
      required:
      - ocrProvider
      - ocrModel
      - features
      title: SettingsResponse
      type: object
    SetupStatusResponse:
      description: Response schema for campaign setup status.
      properties:
        jobs:
          $ref: '#/components/schemas/JobsStatus'
        petitions:
          $ref: '#/components/schemas/PetitionsStatus'
        state:
          title: State
          type: string
        voterList:
          $ref: '#/components/schemas/VoterListStatus'
      required:
      - voterList
      - petitions
      - jobs
      - state
      title: SetupStatusResponse
      type: object
    SupabaseCredentials:
      description: Supabase connection credentials.
      properties:
        db_password:
          description: Database password
          format: password
          minLength: 1
          title: Db Password
          type: string
          writeOnly: true
        project_url:
          description: Supabase project URL or custom domain
          pattern: ^https://[a-z0-9][a-z0-9.-]+\.[a-z]{2,}
          title: Project Url
          type: string
        service_key:
          description: Service role key
          format: password
          minLength: 50
          title: Service Key
          type: string
          writeOnly: true
      required:
      - project_url
      - service_key
      - db_password
      title: SupabaseCredentials
      type: object
    UploadDetail:
      description: Typed upload details for voter list status.
      properties:
        fileSize:
          anyOf:
          - type: integer
          - type: 'null'
          title: Filesize
        id:
          title: Id
          type: string
        originalFilename:
          title: Originalfilename
          type: string
        rowCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rowcount
        status:
          title: Status
          type: string
        uploadedAt:
          title: Uploadedat
          type: string
      required:
      - id
      - originalFilename
      - fileSize
      - rowCount
      - uploadedAt
      - status
      title: UploadDetail
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VoterListStatus:
      description: Voter list status sub-object.
      properties:
        exists:
          title: Exists
          type: boolean
        regionName:
          anyOf:
          - type: string
          - type: 'null'
          title: Regionname
        rowCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rowcount
        uploadedAt:
          anyOf:
          - type: string
          - type: 'null'
          title: Uploadedat
      required:
      - exists
      - rowCount
      - uploadedAt
      - regionName
      title: VoterListStatus
      type: object
    VoterListStatusResponse:
      description: Response schema for voter list status.
      properties:
        exists:
          title: Exists
          type: boolean
        upload:
          anyOf:
          - $ref: '#/components/schemas/UploadDetail'
          - type: 'null'
      required:
      - exists
      title: VoterListStatusResponse
      type: object
    VoterListUploadResponse:
      description: Response schema for voter list upload.
      properties:
        filePath:
          title: Filepath
          type: string
        importedCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Importedcount
        message:
          title: Message
          type: string
        rowCount:
          title: Rowcount
          type: integer
      required:
      - message
